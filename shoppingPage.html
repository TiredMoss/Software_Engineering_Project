<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Shopping App - Shopping Page</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" >
        <style>
            body {
                background-color:rgb(116, 144, 68); font-family: sans-serif; text-align:left; 
                margin: 40px auto; padding: 0 16px;
            }
        </style>
        <script>

        </script>
    </head>
    <body>
        <h1>Shopping Page</h1>
        <p>Welcome to the shopping page! Here you can browse and purchase items from our store.</p>
        <p>Click on an item to add it to your shopping cart.</p>
        <p>Once you're ready to checkout, click the "Checkout" button below.</p>
        <button id="checkout" ONCLICK="window.location.href='checkout.html'">Checkout</button>
        <br></br>
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <img src="https://images.albertsons-media.com/is/image/ABS/960564035-C1N1?$ng-ecom-pdp-desktop$&defaultImage=Not_Available" class="card-img-top" alt="Item 1" width="200" height=100% object-fit="cover" 
                        overflow="hidden">
                        <div class="card-body">
                            <h5 class="card-title">Grapes</h5>
                            <p class="card-text">$10.00</p>
                            <button class="btn btn-primary">Add to Cart</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <img src="https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcTxshChzC17IWk5-u7QEqMzyBch6XCpUPrq0LymJt_vW3qnkeCvi0fjFuQKZ-CVVw5281_YMbRv8ngCzsP2_YJ9A5vYJGJWU0jDWtECrYg5TFbNRusUO8bcew&usqp=CAc"
                         class="card-img-top" alt="Item 2" width="200" height=100% object-fit="cover" overflow="hidden">
                        <div class="card-body">
                            <h5 class="card-title">Roses</h5>
                            <p class="card-text">$15.00</p>
                            <button class="btn btn-primary">Add to Cart</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxpTQGquebxktLZmWSIO9eLBYlETmeFhuQIdIpkNF2pQ&s=10" class="card-img-top" alt="Item 3" width="200" height=100% object-fit="cover" 
                        overflow="hidden">
                        <div class="card-body">
                            <h5 class="card-title">Coffee Ice Cream</h5>
                            <p class="card-text">$20.00</p>
                            <button class="btn btn-primary">Add to Cart</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
