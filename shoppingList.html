
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping List</title>
<style>
  body { background-color:lightpink; font-family: sans-serif; text-align:left;   margin: 40px auto; padding: 0 16px; }
  li.bought { text-decoration: line-through; color: black; }
  li {cursor: pointer; padding: 4px 0; }
  ul { list-style: disc; padding-left: 24px;}
</style>
</head>
<body>
  <h1>Shopping list</h1>
  <input id="input" placeholder="Add an item">
  <button id="add">Add</button>
  <ul id="list"></ul>

<script>
  const input = document.getElementById("input");
  const list = document.getElementById("list");

  

  function addItem() {
    const text = input.value.trim();     // to remove spaces
    if (!text) return;
    const listItem = document.createElement("li");   
    listItem.textContent = text;
    listItem.onclick = () => listItem.classList.toggle("bought");   // click to check off
    listItem.ondblclick = () => listItem.remove();                // double-click to delete
    list.appendChild(listItem);
    input.value = "";       // clear the input field so the user can add another item
  }

   document.getElementById("add").onclick = addItem; //   for more functionality, here one way to add, when the user click the add button the item will be added


 
  
  input.onkeydown = e => { if (e.key === "Enter") addItem(); }; // the second when the user click enter key, to make it easier and faster to use.
</script>
</body>
</html>
